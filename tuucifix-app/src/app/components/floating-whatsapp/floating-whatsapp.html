<!-- Contact Menu Widget -->
<div class="tuucifix-contact-widget fixed bottom-6 right-6 z-50 flex flex-col items-end gap-3">

  <!-- Menu options (WhatsApp, SMS, 2 emails) -->
  <div *ngIf="menuOpen"
    class="flex flex-col items-end gap-3.5 animate-scale-in origin-bottom-right">

    <!-- WhatsApp -->
    <button (click)="openWhatsapp()"
      class="flex items-center gap-3 bg-slate-900/95 backdrop-blur-md hover:bg-slate-800 text-white pl-5 pr-7 py-4 rounded-2xl shadow-xl border border-slate-800 transition-all duration-300 hover:-translate-y-0.5 group">
      <span class="w-12 h-12 rounded-full bg-[#25D366] flex items-center justify-center shrink-0">
        <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
      </span>
      <span class="text-base font-semibold whitespace-nowrap">{{ 'CONTACT_MENU.WHATSAPP' | translate }}</span>
    </button>

    <!-- SMS -->
    <button (click)="openSms()"
      class="flex items-center gap-3 bg-slate-900/95 backdrop-blur-md hover:bg-slate-800 text-white pl-5 pr-7 py-4 rounded-2xl shadow-xl border border-slate-800 transition-all duration-300 hover:-translate-y-0.5 group">
      <span class="w-12 h-12 rounded-full bg-sky-500 flex items-center justify-center shrink-0">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8-1.06 0-2.077-.163-3.02-.465L3 21l1.55-3.874A7.947 7.947 0 013 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
      </span>
      <span class="text-base font-semibold whitespace-nowrap">{{ 'CONTACT_MENU.SMS' | translate }}</span>
    </button>

    <!-- Email — Primary -->
    <button (click)="openEmail(emailPrimary)"
      class="flex items-center gap-3 bg-slate-900/95 backdrop-blur-md hover:bg-slate-800 text-white pl-5 pr-7 py-4 rounded-2xl shadow-xl border border-slate-800 transition-all duration-300 hover:-translate-y-0.5 group">
      <span class="w-12 h-12 rounded-full bg-amber-500 flex items-center justify-center shrink-0">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
      </span>
      <span class="flex flex-col items-start leading-tight">
        <span class="text-base font-semibold whitespace-nowrap">{{ 'CONTACT_MENU.EMAIL_PRIMARY' | translate }}</span>
        <span class="text-sm text-slate-400 whitespace-nowrap">{{ emailPrimary }}</span>
      </span>
    </button>

    <!-- Email — Support -->
    <button (click)="openEmail(emailSupport)"
      class="flex items-center gap-3 bg-slate-900/95 backdrop-blur-md hover:bg-slate-800 text-white pl-5 pr-7 py-4 rounded-2xl shadow-xl border border-slate-800 transition-all duration-300 hover:-translate-y-0.5 group">
      <span class="w-12 h-12 rounded-full bg-violet-500 flex items-center justify-center shrink-0">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
      </span>
      <span class="flex flex-col items-start leading-tight">
        <span class="text-base font-semibold whitespace-nowrap">{{ 'CONTACT_MENU.EMAIL_SUPPORT' | translate }}</span>
        <span class="text-sm text-slate-400 whitespace-nowrap">{{ emailSupport }}</span>
      </span>
    </button>
  </div>

  <!-- Main toggle button -->
  <button (click)="toggleMenu()"
    class="bg-slate-900 text-white p-5 rounded-full shadow-2xl transition-all duration-300 transform hover:scale-110 flex items-center justify-center border border-slate-800 hover:bg-slate-800 hover:shadow-[0_8px_30px_rgba(15,23,42,0.45)]"
    [attr.aria-label]="'CONTACT_MENU.TOGGLE' | translate"
    [attr.aria-expanded]="menuOpen">

    <!-- Generic "contact us" icon (closed state) — headset / support bubble -->
    <svg *ngIf="!menuOpen" class="w-11 h-11 md:w-12 md:h-12" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 11a9 9 0 0118 0v5a2.5 2.5 0 01-2.5 2.5H17a1 1 0 01-1-1v-4a1 1 0 011-1h2v-1.5a7 7 0 00-14 0V13h2a1 1 0 011 1v4a1 1 0 01-1 1h-1.5A2.5 2.5 0 013 16.5V11z"/>
      <path stroke-linecap="round" stroke-linejoin="round" d="M8.5 18.5a3.5 3.5 0 003.5 3"/>
    </svg>

    <!-- Close icon (open state) -->
    <svg *ngIf="menuOpen" class="w-10 h-10 md:w-11 md:h-11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
    </svg>
  </button>
</div>
